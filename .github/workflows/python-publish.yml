# Builds and publishes the package to PyPI when a GitHub release is published.
# Version is derived from the release tag by setuptools-scm.
# Publishing uses PyPI Trusted Publishing (OIDC) - no API token required.
# See: https://docs.pypi.org/trusted-publishers/

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools-scm needs full history and tags
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
